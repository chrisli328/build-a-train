<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16204a">
<meta name="mobile-web-app-capable" content="yes">
<title>Build A Train</title>
<meta name="description" content="Ride an armoured train through the zombie snowlands. Your crew shoots by itself, you pick the track. Portrait mobile concept demo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Build A Train">
<meta property="og:description" content="Ride an armoured train through the zombie snowlands. Your crew shoots by itself, you pick the track. Portrait mobile concept demo.">
<meta property="og:url" content="https://chrisli328.github.io/build-a-train/">
<meta property="og:image" content="https://chrisli328.github.io/build-a-train/img/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/sprites/train.webp">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preload" href="img/splash.webp" as="image" fetchpriority="high">
<link rel="preload" href="vendor/fonts/Kanit-ExtraBoldItalic.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/game.f480951600.css">
<link rel="modulepreload" href="js/main.134c94eafd.js">
<link rel="modulepreload" href="js/run.bd9bffc651.js">
<link rel="modulepreload" href="js/data.086f335293.js">
<link rel="modulepreload" href="js/art.27597f9460.js">
<link rel="modulepreload" href="js/fx.6462c7e2bb.js">
<link rel="modulepreload" href="js/ui.ddb8ef444b.js">
<link rel="modulepreload" href="js/audio.a7f44784ac.js">
<link rel="modulepreload" href="js/save.ce36348db2.js">
</head>
<body data-lb="off">
<div id="app">
  <canvas id="game"></canvas>

  <!-- lobby -->
  <div id="lobby" class="screen hidden">
    <div class="topbar">
      <button class="btn pill cap fuel t t-thin" id="fuelPill"><img src="img/ui/i-fuel.webp" alt=""><span id="fuelTxt">30/30</span><small class="t-thin" id="fuelSub">FULL</small></button>
      <button class="btn pill cap coins t t-thin" id="coinPill"><img src="img/ui/i-coin.webp" alt=""><span id="coinTxt">0</span><img class="plus" src="img/ui/i-plus.webp" alt=""></button>
      <button class="btn pill cap gems t t-thin" id="gemPill"><img src="img/ui/i-gem.webp" alt=""><span id="gemTxt">0</span><img class="plus" src="img/ui/i-plus.webp" alt=""></button>
      <button class="btn disc gear" id="gearBtn"><img src="img/ui/i-gear.webp" alt=""></button>
    </div>

    <div id="homePage" class="page">
      <div class="stage">
        <button class="btn disc arrow l" id="stagePrev"><img src="img/ui/i-chev.webp" alt=""></button>
        <div class="panel card">
          <div class="chap t t-thin" id="chapTxt">CHAPTER 1</div>
          <div class="name t" id="stageName">FROST LINE</div>
          <div class="stars" id="stageStars"></div>
        </div>
        <button class="btn disc arrow r" id="stageNext"><img src="img/ui/i-chev.webp" alt=""></button>
      </div>
      <div class="side left">
        <button class="btn sbtn" id="patrolBtn"><span class="disc"><img src="img/ui/l-depot.webp" alt=""></span><span class="pill lbl t t-thin">Depot</span><span class="badge t t-thin" id="patrolBadge">0</span></button>
        <button class="btn sbtn" id="dailyBtn"><span class="disc"><img src="img/ui/l-daily.webp" alt=""></span><span class="pill lbl t t-thin">Daily</span><span class="dot t t-thin hidden" id="dailyDot">!</span></button>
      </div>
      <div class="side right">
        <button class="btn sbtn" id="passBtn"><span class="disc"><img src="img/ui/l-pass.webp" alt=""></span><span class="pill lbl t t-thin">Pass</span></button>
        <button class="btn sbtn" id="eventBtn"><span class="disc"><img src="img/ui/l-convoy.webp" alt=""></span><span class="pill lbl t t-thin">Convoy</span><span class="badge t t-thin">2d 4h</span></button>
      </div>
      <div class="lineup" id="lineup"></div>
      <button class="btn t" id="playBtn"><span>START</span><small class="cost t t-thin"><img src="img/ui/i-fuel.webp" alt="">5</small></button>
    </div>

    <div id="crewPage" class="page sheet hidden"></div>
    <div id="trainPage" class="page sheet hidden"></div>
    <div id="shopPage" class="page sheet hidden"></div>
    <div id="railsPage" class="page sheet hidden"></div>

    <nav class="nav">
      <button class="btn tab t t-thin" data-tab="shop"><img src="img/ui/l-shop.webp" alt="">Shop</button>
      <button class="btn tab t t-thin" data-tab="crew"><img src="img/ui/l-crew.webp" alt="">Crew<i class="dot hidden" id="crewDot">!</i></button>
      <button class="btn tab t t-thin on" data-tab="home"><img src="img/ui/l-battle.webp" alt="">Battle</button>
      <button class="btn tab t t-thin" data-tab="train"><img src="img/ui/l-train.webp" alt="">Train</button>
      <button class="btn tab t t-thin" data-tab="rails"><img src="img/ui/l-rails.webp" alt="">Rails</button>
    </nav>
  </div>

  <!-- in run -->
  <div id="hud" class="screen hidden">
    <div class="progress">
      <div class="pill bar"><i class="fill blue" id="progFill"></i></div>
      <div id="progNodes"></div>
      <img class="engine" id="progEngine" src="img/ui/i-train.webp" alt="">
      <img class="goal" src="img/ui/i-skull-pink.webp" alt="">
    </div>
    <div class="lvrow">
      <div class="pill xp"><i class="fill blue" id="xpFill"></i></div>
      <div class="disc lv t" id="lvBadge"><span id="lvTxt">1</span></div>
    </div>
    <div class="pill kills t t-thin"><img src="img/ui/i-skull.webp" alt=""><span id="killTxt">0</span></div>
    <div class="pill coins t t-thin" id="runCoins"><img src="img/ui/i-coin.webp" alt=""><span id="runCoinTxt">0</span></div>
    <button class="btn disc pause" id="pauseBtn"><img src="img/ui/i-pause.webp" alt=""></button>
    <div class="boss hidden" id="bossBar"><div class="name t t-thin">YETI KING</div><div class="pill bar"><i class="fill yellow trail" id="bossTrail"></i><i class="fill red" id="bossFill"></i></div></div>
    <div class="combo t hidden" id="combo"></div>
    <div class="routes hidden" id="routes">
      <div class="warn">
        <img class="chain l" src="img/ui/ui-chain.webp" alt=""><img class="chain r" src="img/ui/ui-chain.webp" alt="">
        <div class="clock" id="routeClock">
          <img class="dial" src="img/ui/ui-dial.webp" alt="">
          <img class="ring" id="routeRing" src="img/ui/ui-dial-ring.webp" alt="">
          <b class="t" id="routeSec">9</b>
        </div>
        <div class="board">
          <img class="face" src="img/ui/ui-route-board.webp" alt="">
          <img class="beacon l" src="img/ui/ui-beacon-glow.webp" alt=""><img class="beacon r" src="img/ui/ui-beacon-glow.webp" alt="">
          <span class="t">PICK A TRACK!</span>
        </div>
      </div>
      <button class="btn route l" data-side="-1"></button>
      <button class="btn route r" data-side="1"></button>
    </div>
    <button class="btn od" id="odBtn">
      <img class="base" src="img/ui/i-steam.webp" alt="">
      <img class="ring" id="odRing" src="img/ui/i-steam-ring.webp" alt="">
      <span class="pill lbl t t-thin">FULL STEAM</span>
    </button>
    <div id="banner" class="t"></div>
  </div>

  <div id="cards" class="screen hidden">
    <div class="title"><img src="img/ui/ui-title.webp" alt=""><span class="t" id="cardsTitle">LEVEL UP!</span></div>
    <div class="pill sub t t-thin" id="cardsSub">Pick one</div>
    <div class="row" id="cardRow"></div>
    <button class="btn pill t t-thin reroll" id="rerollBtn"><img src="img/ui/i-ad.webp" alt="">Reroll</button>
  </div>

  <div id="result" class="screen hidden"></div>

  <div id="fx"></div>
  <div id="modalHost"></div>
  <div id="curtain"></div>
  <div id="overlayHost"></div>

  <!-- loading -->
  <div id="loading" class="screen">
    <img class="splash" src="img/splash.webp" alt="Build A Train" fetchpriority="high" onload="this.classList.add('on')">
    <div class="foot">
      <div class="tip plate t t-thin" id="loadTip">Your crew shoots by itself. You pick the track!</div>
      <div class="bar"><i id="loadBar"><img src="img/sprites/train.webp" alt=""></i><b class="pct t t-thin" id="loadPct">0%</b></div>
    </div>
  </div>
</div>
<script type="module" src="js/main.134c94eafd.js"></script>
</body>
</html>
